<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filters</title>
    <style>
        .container{
            height: 80vh;
            width: 80wh;
        } 
        /* img{
            filter: blur(10px);
        } */

        .img1{
            filter: brightness(200%);
            height: 250px;
            width: 340px;
        }

        .img2{
            filter: hue-rotate(200%);
            height: 250px;
            width: 340px;
        }

        .img3{
            filter: grayscale(100%);
            height: 250px;
            width: 340px;
        }
       
    </style>
</head>
<body>
    <div class="container"> 
        <img class="img1" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTzJiL2savWoGa11xgA0dE_0XjhbdeZokBLo_dScmZJKg&s=10" alt="">
        <img class="img2" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS3olQPtch3Y-TAcJVXJibxEfWIjtZFYcrbXHfcr8rjDDm3RgDaXwUSXhU&s=10" alt="">
        <img class="img3" src="https://cdn.pixabay.com/photo/2024/05/26/10/15/bird-8788491_1280.jpg" alt="">
    </div>
</body>
</html>
