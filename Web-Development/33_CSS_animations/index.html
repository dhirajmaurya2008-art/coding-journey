<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animations</title>
    <style>
        .container{
            background-color: rgb(241, 239, 69);
            height: 80vh;
            width: 80vw;
        }

        .box{
            align-content: flex-end;
            width: 80px;
            height: 80px; 
            animation-name: dhirajAnimation; 
            animation-duration: 1s; 
            animation-iteration-count: infinite;
            animation-timing-function: cubic-bezier(0, 0, 0, 0.96);
            animation-delay: 1s;
            animation-direction: reverse;
            animation-play-state: paused; 
         /* animation: name duration timing-function delay iteration-count direction fill-mode; */
            animation: dhirajAnimation 2s ease-in-out 3s 1, 
                       dhiraj2 3s ease-in-out 3s 1;
        }

        @keyframes dhirajAnimation {
            from{
                background-color: rgb(71, 199, 250);
            }
            to{
                background-color: rgb(67, 228, 75); 
            }
        }

        @keyframes dhiraj2 {
            0%{
                transform: rotate(60deg);
            }
            20%{
                transform: rotate(120deg);
            }
            40%{
                transform: rotate(180deg);
            }
            60%{
                transform: rotate(260deg);
            }
            80%{
                transform: rotate(320deg);
            }
            100%{
                transform: rotate(360deg); 
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" >
            Box
        </div>
    </div>
</body>
</html>
